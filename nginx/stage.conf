# MicioDev portfolio — STAGING site (stage.micio86dev.it).
#
# AUTHORITATIVE site file — the repo is the source of truth. The deploy workflow
# (.github/workflows/deploy-stage.yml) scp's this to
# /etc/nginx/sites-available/portfolio-stage on EVERY deploy, then symlinks it
# into sites-enabled/ and reloads nginx. So everything Certbot's --nginx plugin
# would otherwise rewrite is baked in here directly: the :443 server block, the
# ssl_certificate directives, and the HTTP→HTTPS redirect. Certbot still owns
# RENEWAL — `certbot renew` only refreshes the cert files in place, it does not
# rewrite this config — so the scp-on-every-deploy never clobbers TLS.
#
# Prereqs that must already exist on the VPS (one-time, never committed):
#   1. TLS cert for stage.micio86dev.it under /etc/letsencrypt/live/ — e.g.
#        certbot certonly --nginx -d stage.micio86dev.it
#      If the cert is missing, `nginx -t` fails and the deploy aborts.
#   2. Basic-auth password file:
#        sudo apt install apache2-utils -y
#        sudo htpasswd -c /etc/nginx/.htpasswd_portfolio_stage YOUR_USERNAME
#   3. The old stage.micio86dev.it server block in nginx/portfolio.conf removed
#      on the VPS (this file supersedes it).
#
# Three layers keep this host out of search indexes: nginx X-Robots-Tag below +
# HTTP Basic Auth (only the owner can even reach it) + Astro's noindex meta on
# stage.* hosts.

# HTTP → HTTPS. (Certbot renewal with --nginx uses the tls-alpn-01 challenge on
# :443, so a plain redirect here is fine — no ACME webroot carve-out needed.)
server {
  listen 80;
  server_name stage.micio86dev.it;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name stage.micio86dev.it;

  ssl_certificate     /etc/letsencrypt/live/stage.micio86dev.it/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/stage.micio86dev.it/privkey.pem;
  include             /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

  # Layer 1 — noindex at the edge, on every response.
  add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  client_max_body_size 8m;

  # Layer 2 — HTTP Basic Auth (file created manually on the VPS, see header).
  auth_basic "Portfolio Stage";
  auth_basic_user_file /etc/nginx/.htpasswd_portfolio_stage;

  location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Content-hashed assets — cache forever. nginx `add_header` does NOT inherit into
  # a location that sets its own, so re-state X-Robots-Tag here on purpose.
  location /_astro/ {
    proxy_pass http://127.0.0.1:3001;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Robots-Tag "noindex" always;
  }
}
