# MicioDev portfolio — STAGING site (stage.micio86dev.it).
#
# Standalone site file. Deployed to /etc/nginx/sites-available/portfolio-stage by
# .github/workflows/deploy-stage.yml, then symlinked into sites-enabled. SUPERSEDES
# the stage.micio86dev.it server block in nginx/portfolio.conf — remove that block
# on the VPS once this is in place.
#
# Two layers keep this host out of search indexes (Astro also emits a noindex meta
# on stage.* hosts — third layer in robots.txt): nginx X-Robots-Tag below + HTTP
# Basic Auth (only the owner can even reach it).
#
# REQUIRED ONE-TIME MANUAL STEP ON THE VPS (never commit the password file):
#   sudo apt install apache2-utils -y
#   sudo htpasswd -c /etc/nginx/.htpasswd_portfolio_stage YOUR_USERNAME
#
# TLS: run certbot AFTER this file is enabled (certbot rewrites the `listen` lines
# and injects ssl_certificate directives, marked "managed by Certbot"):
#   certbot --nginx -d stage.micio86dev.it

server {
  listen 80;                       # managed by Certbot → listen 443 ssl;
  # listen 443 ssl;                 # managed by Certbot
  server_name stage.micio86dev.it;

  # ssl_certificate     /etc/letsencrypt/live/stage.micio86dev.it/fullchain.pem;   # managed by Certbot
  # ssl_certificate_key /etc/letsencrypt/live/stage.micio86dev.it/privkey.pem;      # managed by Certbot
  # include             /etc/letsencrypt/options-ssl-nginx.conf;                    # managed by Certbot
  # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;                          # managed by Certbot

  # Layer 1 — noindex at the edge, on every response.
  add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  client_max_body_size 8m;

  # Layer 2 — HTTP Basic Auth (file created manually on the VPS, see header).
  auth_basic "Portfolio Stage";
  auth_basic_user_file /etc/nginx/.htpasswd_portfolio_stage;

  location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Content-hashed assets — cache forever. nginx `add_header` does NOT inherit into
  # a location that sets its own, so re-state X-Robots-Tag here on purpose.
  location /_astro/ {
    proxy_pass http://127.0.0.1:3001;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Robots-Tag "noindex" always;
  }
}
