# MicioDev portfolio — PRODUCTION site (micio86dev.it → astro container :4322).
#
# CI never touches nginx (the deploy user is non-root, not a sudoer). Deploy this
# by hand, as root, and re-do it only when this file changes in the repo:
#   sudo cp nginx/micio86dev.conf /etc/nginx/sites-available/micio86dev
#   sudo ln -s /etc/nginx/sites-available/micio86dev /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Production PocketBase has its own file: nginx/pb.micio86dev.it.conf.
#
# AUTHORITATIVE — the :443 server blocks, the ssl_certificate directives, and the
# HTTP→HTTPS / www→apex redirects are all baked in; Certbot only RENEWS the cert
# files in place, it never rewrites this config.
#
# Prereq on the VPS (one-time): a TLS cert covering both names —
#   certbot certonly --nginx -d micio86dev.it -d www.micio86dev.it
# (without it `nginx -t` fails).

# www.micio86dev.it → https://micio86dev.it (both schemes).
server {
  listen 80;
  listen 443 ssl;
  server_name www.micio86dev.it;

  ssl_certificate     /etc/letsencrypt/live/micio86dev.it/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/micio86dev.it/privkey.pem;
  include             /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

  return 301 https://micio86dev.it$request_uri;
}

# http://micio86dev.it → https://micio86dev.it
server {
  listen 80;
  server_name micio86dev.it;
  return 301 https://micio86dev.it$request_uri;
}

server {
  listen 443 ssl;
  server_name micio86dev.it;

  ssl_certificate     /etc/letsencrypt/live/micio86dev.it/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/micio86dev.it/privkey.pem;
  include             /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

  # Security headers. HSTS + COOP are sent here (the document CSP <meta> lives
  # in BaseLayout.astro; `frame-ancestors`/clickjacking is covered by the
  # X-Frame-Options below, since a <meta> CSP can't carry `frame-ancestors`).
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  client_max_body_size 8m;

  location / {
    proxy_pass http://127.0.0.1:4322;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Buffer the chunked SSR response in full and send it to the client with a
    # Content-Length instead of re-chunking it. Works around an nginx 1.18
    # quirk: with chunked upstream + HTTP/1.1 keep-alive (or HTTP/2 under
    # specific timing), nginx occasionally drops the trailing chunk and leaves
    # the stream open until the 60s read timeout — user sees a hang, a blank
    # page, or has to click again. Buffers are sized to fit a ~70 KB SSR page
    # comfortably in RAM (8 × 32 KB = 256 KB) so nothing spills to disk.
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 32 16k;
    proxy_busy_buffers_size 32k;
    chunked_transfer_encoding off;
  }

  # Astro's content-hashed assets and fonts — cache forever. nginx `add_header`
  # does NOT inherit into a location that sets its own, so re-state HSTS here.
  location ~* ^/(_astro|fonts)/ {
    proxy_pass http://127.0.0.1:4322;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  }
}
