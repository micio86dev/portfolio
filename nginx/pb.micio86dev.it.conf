# MicioDev portfolio — PRODUCTION PocketBase (pb.micio86dev.it → pocketbase :8090).
#
# Serves the REST API the contact form POSTs to (PocketBase sets permissive CORS
# on /api/*) and the admin UI at /_/. NO HTTP Basic Auth — it must stay
# browser-reachable; PocketBase has its own admin auth.
#
# CI never touches nginx (the deploy user is non-root). Deploy this by hand, as
# root, and re-do it only when this file changes in the repo:
#   sudo cp nginx/pb.micio86dev.it.conf /etc/nginx/sites-available/pb.micio86dev.it
#   sudo ln -s /etc/nginx/sites-available/pb.micio86dev.it /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# AUTHORITATIVE — the :443 server block, the ssl_certificate directives, and the
# :80→:443 redirect are all baked in; Certbot only renews the cert files in place.
#
# Prereq on the VPS (one-time): a TLS cert for pb.micio86dev.it under
# /etc/letsencrypt/live/ — e.g. `certbot certonly --nginx -d pb.micio86dev.it`.

server {
  listen 80;
  server_name pb.micio86dev.it;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name pb.micio86dev.it;

  ssl_certificate     /etc/letsencrypt/live/pb.micio86dev.it/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/pb.micio86dev.it/privkey.pem;
  include             /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  client_max_body_size 8m;

  location / {
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # PocketBase realtime (SSE/WebSocket).
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
  }
}
