# MicioDev portfolio — host nginx reverse proxy.
#
# Architecture: the Astro app runs as an SSR Node server (containers on
# 127.0.0.1:3000 prod / :3001 stage) and PocketBase runs alongside it
# (127.0.0.1:8090 prod / :8091 stage). The contact form POSTs straight from the
# browser to PocketBase, so PocketBase needs a public hostname — pb.micio86dev.it
# (prod) / pb-stage.micio86dev.it (stage). PocketBase sets permissive CORS on
# /api/* so the cross-subdomain POST from the site works.
#
# Deploy: copy to /etc/nginx/sites-available/portfolio on the VPS, then
#   ln -s /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# TLS: run certbot AFTER this file is in place; it rewrites the `listen` lines,
# injects the ssl_certificate directives (marked "managed by Certbot"), and adds
# an HTTP→HTTPS redirect server block:
#   certbot --nginx -d micio86dev.it -d www.micio86dev.it \
#                   -d stage.micio86dev.it \
#                   -d pb.micio86dev.it -d pb-stage.micio86dev.it

# ── shared bits ────────────────────────────────────────────────────────
gzip on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_vary on;
gzip_types
  text/plain
  text/css
  text/javascript
  application/javascript
  application/json
  application/xml
  image/svg+xml;

# Astro emits content-hashed files under /_astro/ and /fonts/ — safe to cache
# forever; everything else (HTML) must always be revalidated. This map drives a
# single `add_header Cache-Control $portfolio_cache_control` per server block —
# do NOT also add a `location /_astro/ { ... }` block, it would shadow this and
# require duplicating the upstream proxy config.
map $uri $portfolio_cache_control {
  default                 "no-cache";
  ~*^/_astro/             "public, max-age=31536000, immutable";
  ~*^/fonts/              "public, max-age=31536000, immutable";
  ~*\.(?:css|js|woff2?)$  "public, max-age=31536000, immutable";
}

# ════════════════════════════════════════════════════════════════════════
#  STAGING SITE — stage.micio86dev.it → astro container :3001
# ════════════════════════════════════════════════════════════════════════
# NOTE: superseded by nginx/stage.conf (adds HTTP Basic Auth + X-Robots-Tag noindex). Remove this block on the VPS once stage.conf is deployed as the 'portfolio-stage' site.
server {
  listen 80;                       # managed by Certbot → listen 443 ssl;
  # listen 443 ssl;                 # managed by Certbot
  server_name stage.micio86dev.it;

  # ssl_certificate     /etc/letsencrypt/live/stage.micio86dev.it/fullchain.pem;   # managed by Certbot
  # ssl_certificate_key /etc/letsencrypt/live/stage.micio86dev.it/privkey.pem;      # managed by Certbot
  # include             /etc/letsencrypt/options-ssl-nginx.conf;                    # managed by Certbot
  # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;                          # managed by Certbot

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Cache-Control $portfolio_cache_control always;

  client_max_body_size 8m;

  location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# ════════════════════════════════════════════════════════════════════════
#  STAGING POCKETBASE — pb-stage.micio86dev.it → pocketbase container :8091
# ════════════════════════════════════════════════════════════════════════
# NOTE: superseded by nginx/stage-pb.conf (carries its own :443/SSL block + X-Robots-Tag
# noindex, and the deploy-stage workflow syncs it automatically). Remove this block on
# the VPS once stage-pb.conf is deployed as the 'portfolio-stage-pb' site.
server {
  listen 80;                       # managed by Certbot → listen 443 ssl;
  server_name pb-stage.micio86dev.it;

  # ssl_certificate     /etc/letsencrypt/live/pb-stage.micio86dev.it/fullchain.pem;  # managed by Certbot
  # ssl_certificate_key /etc/letsencrypt/live/pb-stage.micio86dev.it/privkey.pem;    # managed by Certbot

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  client_max_body_size 8m;

  location / {
    proxy_pass http://127.0.0.1:8091;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
  }
}

# ════════════════════════════════════════════════════════════════════════
#  PRODUCTION SITE — micio86dev.it (+ www → apex) → astro container :3000
# ════════════════════════════════════════════════════════════════════════
server {
  listen 80;                       # managed by Certbot → listen 443 ssl;
  server_name www.micio86dev.it;
  return 301 https://micio86dev.it$request_uri;
}

server {
  listen 80;                       # managed by Certbot → listen 443 ssl;
  # listen 443 ssl;                 # managed by Certbot
  server_name micio86dev.it;

  # ssl_certificate     /etc/letsencrypt/live/micio86dev.it/fullchain.pem;   # managed by Certbot
  # ssl_certificate_key /etc/letsencrypt/live/micio86dev.it/privkey.pem;      # managed by Certbot
  # include             /etc/letsencrypt/options-ssl-nginx.conf;             # managed by Certbot
  # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;                   # managed by Certbot

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Cache-Control $portfolio_cache_control always;

  client_max_body_size 8m;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

