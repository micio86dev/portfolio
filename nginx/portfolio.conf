# MicioDev portfolio — host nginx reverse proxy.
#
# Deploy: copy to /etc/nginx/sites-available/portfolio on the VPS, then
#   ln -s /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# TLS: run certbot AFTER this file is in place; it rewrites the `listen` lines
# and injects the ssl_certificate directives (marked "managed by Certbot" below)
# and an HTTP→HTTPS redirect server block.
#   certbot --nginx -d micio86dev.it -d www.micio86dev.it -d stage.micio86dev.it

# ── shared bits ────────────────────────────────────────────────────────
gzip on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_vary on;
gzip_types
  text/plain
  text/css
  text/javascript
  application/javascript
  application/json
  application/xml
  image/svg+xml;

# Astro emits content-hashed files under /_astro/ and /fonts/ — safe to cache
# forever; everything else (HTML) must always be revalidated.
map $uri $portfolio_cache_control {
  default                 "no-cache";
  ~*^/_astro/             "public, max-age=31536000, immutable";
  ~*^/fonts/              "public, max-age=31536000, immutable";
  ~*\.(?:css|js|woff2?)$  "public, max-age=31536000, immutable";
}

# ── proxy header set, reused per location ──────────────────────────────
# (kept inline below; nginx has no `include`-able snippet shipped with the repo)

# ════════════════════════════════════════════════════════════════════════
#  STAGING — stage.micio86dev.it → astro :3001, pocketbase :8091
# ════════════════════════════════════════════════════════════════════════
server {
  listen 80;                       # managed by Certbot → listen 443 ssl;
  # listen 443 ssl;                 # managed by Certbot
  server_name stage.micio86dev.it;

  # ssl_certificate     /etc/letsencrypt/live/stage.micio86dev.it/fullchain.pem;   # managed by Certbot
  # ssl_certificate_key /etc/letsencrypt/live/stage.micio86dev.it/privkey.pem;      # managed by Certbot
  # include             /etc/letsencrypt/options-ssl-nginx.conf;                    # managed by Certbot
  # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;                          # managed by Certbot

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Cache-Control $portfolio_cache_control always;

  client_max_body_size 8m;

  # PocketBase REST/admin under /api  (and /_/ for the admin UI if you want it public)
  location /api/ {
    proxy_pass http://127.0.0.1:8091;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
  }

  location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# ════════════════════════════════════════════════════════════════════════
#  PRODUCTION — micio86dev.it → astro :3000  (pocketbase :8090, optional)
# ════════════════════════════════════════════════════════════════════════

# www → apex redirect
server {
  listen 80;                       # managed by Certbot → listen 443 ssl;
  server_name www.micio86dev.it;
  return 301 https://micio86dev.it$request_uri;
}

server {
  listen 80;                       # managed by Certbot → listen 443 ssl;
  # listen 443 ssl;                 # managed by Certbot
  server_name micio86dev.it;

  # ssl_certificate     /etc/letsencrypt/live/micio86dev.it/fullchain.pem;   # managed by Certbot
  # ssl_certificate_key /etc/letsencrypt/live/micio86dev.it/privkey.pem;      # managed by Certbot
  # include             /etc/letsencrypt/options-ssl-nginx.conf;             # managed by Certbot
  # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;                   # managed by Certbot

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Cache-Control $portfolio_cache_control always;

  client_max_body_size 8m;

  # Production PocketBase is bound to 127.0.0.1:8090 on the host. Uncomment to
  # expose it publicly under /api (only if the frontend needs it at runtime —
  # by default this Astro site fetches PocketBase only at build time).
  # location /api/ {
  #   proxy_pass http://127.0.0.1:8090;
  #   proxy_http_version 1.1;
  #   proxy_set_header Host              $host;
  #   proxy_set_header X-Real-IP         $remote_addr;
  #   proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  #   proxy_set_header X-Forwarded-Proto $scheme;
  #   proxy_set_header Upgrade           $http_upgrade;
  #   proxy_set_header Connection        "upgrade";
  # }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
