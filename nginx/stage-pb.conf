# MicioDev portfolio — STAGING PocketBase (pb-stage.micio86dev.it → :8091).
#
# AUTHORITATIVE site file — same deal as nginx/stage.conf: the deploy workflow
# (.github/workflows/deploy-stage.yml) scp's this to
# /etc/nginx/sites-available/portfolio-stage-pb on EVERY deploy, symlinks it into
# sites-enabled/ and reloads nginx. Everything Certbot's --nginx plugin would
# rewrite is baked in here (the :443 server block, the ssl_certificate
# directives, the :80→:443 redirect); Certbot only handles renewal.
#
# Prereq on the VPS (one-time): a TLS cert for pb-stage.micio86dev.it under
# /etc/letsencrypt/live/ — e.g. `certbot certonly --nginx -d pb-stage.micio86dev.it`.
# If it's missing, `nginx -t` fails and the deploy aborts.
#
# NO HTTP Basic Auth here on purpose: the contact-form Vue island POSTs straight
# from the browser to ${PUBLIC_PB_URL}/api/collections/contacts/records, so the
# host must stay publicly reachable. PocketBase has its own admin auth at /_/ and
# sets permissive CORS on /api/*. We still send X-Robots-Tag noindex (staging).

server {
  listen 80;
  server_name pb-stage.micio86dev.it;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name pb-stage.micio86dev.it;

  ssl_certificate     /etc/letsencrypt/live/pb-stage.micio86dev.it/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/pb-stage.micio86dev.it/privkey.pem;
  include             /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

  add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  client_max_body_size 8m;

  location / {
    proxy_pass http://127.0.0.1:8091;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # PocketBase realtime (SSE/WebSocket).
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
  }
}
