# Local development stack — builds both images from source.
#
#   docker compose up --build
#   → site:        http://localhost:4321
#   → PocketBase:  http://localhost:8090/_/   (create the first superuser here)
#
# PUBLIC_PB_URL must be reachable from the BROWSER (the contact form POSTs to it
# directly), so it's http://localhost:8090 via the pocketbase port mapping below.
# PB_URL_INTERNAL is the server-to-server override SSR uses inside the docker
# network — `localhost` from the astro container would loop back to itself, so
# we point at the `pocketbase` service hostname instead. This is what makes
# getProjects/getCustomers serve real PB content in local Docker, not the
# bundled seed fallback.

services:
  astro:
    build:
      context: ./astro
      args:
        SITE_URL: ${SITE_URL:-http://localhost:4321}
    ports:
      - "4321:4321"
    environment:
      - PUBLIC_PB_URL=http://localhost:8090
      - PB_URL_INTERNAL=http://pocketbase:8090
      - PUBLIC_SITE_URL=http://localhost:4321
    depends_on:
      - pocketbase

  pocketbase:
    build:
      context: ./pb
    ports:
      - "8090:8090"
    volumes:
      - pb_data:/pb/pb_data

volumes:
  pb_data:
