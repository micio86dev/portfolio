# Local development stack — builds both images from source.
#
#   docker compose up --build
#   → site:        http://localhost:4321
#   → PocketBase:  http://localhost:8090/_/   (create the first superuser here)
#
# PUBLIC_PB_URL must be reachable from the BROWSER (the contact form POSTs to it
# directly), so it's http://localhost:8090 via the pocketbase port mapping below.
# Note: SSR-side fetches in the astro container resolve `localhost` to the astro
# container itself, so getProjects/getServices fall back to bundled seed data
# here. For live local PocketBase data in SSR, run `npm run dev` in ./astro on
# the host instead, or add an internal PB_URL override.

services:
  astro:
    build:
      context: ./astro
      args:
        SITE_URL: ${SITE_URL:-http://localhost:4321}
    ports:
      - "4321:4321"
    environment:
      - PUBLIC_PB_URL=http://localhost:8090
    depends_on:
      - pocketbase

  pocketbase:
    build:
      context: ./pb
    ports:
      - "8090:8090"
    volumes:
      - pb_data:/pb/pb_data

volumes:
  pb_data:
