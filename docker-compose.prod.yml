# Production overrides — used on the VPS, on its own:
#
#   cd /var/www/html/micio86dev.it
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d --remove-orphans
#
# Self-contained: passing `-f docker-compose.prod.yml` does NOT auto-load
# docker-compose.yml, so there is no build context — images are pulled from
# GHCR. `${PROD_PB_URL}` is read from a `./.env` file in this directory on the
# VPS (the deploy workflow writes it from the PROD_PB_URL repo secret). It is a
# public hostname, not a secret. This file is also the *base* for
# docker-compose.stage.yml.

services:
  astro:
    image: ghcr.io/micio86dev/portfolio-astro:latest
    container_name: portfolio-astro
    ports:
      - "3000:4321"
    environment:
      # Reached by the browser (contact form) AND by the SSR server.
      - PUBLIC_PB_URL=${PROD_PB_URL}
      # Runtime origin for the /sitemap.xml and /robots.txt SSR endpoints.
      - PUBLIC_SITE_URL=https://micio86dev.it
    restart: unless-stopped
    depends_on:
      - pocketbase

  pocketbase:
    image: ghcr.io/micio86dev/portfolio-pb:latest
    container_name: portfolio-pocketbase
    ports:
      # Loopback only — host nginx reverse-proxies pb.micio86dev.it → here.
      - "127.0.0.1:8090:8090"
    volumes:
      - /var/www/html/micio86dev.it/pb_data:/pb/pb_data
    restart: unless-stopped
