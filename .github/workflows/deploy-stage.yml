name: Deploy — staging

# Triggered by merges to develop. Builds + pushes :develop images to GHCR,
# then SSHes into the VPS and rolls the staging stack.
on:
  push:
    branches: [develop]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-stage
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_ASTRO: ghcr.io/micio86dev/portfolio-astro
  IMAGE_PB: ghcr.io/micio86dev/portfolio-pb
  TAG: develop
  SITE_URL: https://stage.micio86dev.it

jobs:
  deploy:
    name: build → push → deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push astro image
        uses: docker/build-push-action@v6
        with:
          context: ./astro
          push: true
          tags: ${{ env.IMAGE_ASTRO }}:${{ env.TAG }}
          # PUBLIC_PB_URL is NOT a build arg — it's injected at container start
          # (see docker-compose.stage.yml). Only the public SITE_URL is baked in.
          build-args: |
            SITE_URL=${{ env.SITE_URL }}

      - name: Build & push pocketbase image
        uses: docker/build-push-action@v6
        with:
          context: ./pb
          push: true
          tags: ${{ env.IMAGE_PB }}:${{ env.TAG }}

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Sync compose files to VPS
        env:
          SSH_TARGET: ${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}
        run: |
          scp -o StrictHostKeyChecking=accept-new \
            docker-compose.prod.yml docker-compose.stage.yml \
            "${SSH_TARGET}:/var/www/portfolio-stage/"

      - name: Write runtime env on VPS
        # docker-compose.stage.yml reads ${STAGE_PB_URL} from this .env. The
        # value is piped over the SSH session — never echoed to the build log.
        env:
          SSH_TARGET: ${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}
          STAGE_PB_URL: ${{ secrets.STAGE_PB_URL }}
        run: |
          printf 'STAGE_PB_URL=%s\n' "$STAGE_PB_URL" \
            | ssh -o StrictHostKeyChecking=accept-new "${SSH_TARGET}" \
              'umask 077 && cat > /var/www/portfolio-stage/.env'

      - name: Deploy on VPS
        env:
          SSH_TARGET: ${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new "${SSH_TARGET}" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /var/www/portfolio-stage
          docker compose -f docker-compose.prod.yml -f docker-compose.stage.yml pull
          docker compose -f docker-compose.prod.yml -f docker-compose.stage.yml up -d --remove-orphans
          docker exec portfolio-stage-pocketbase \
            /pb/pocketbase migrate up --dir=/pb/pb_data --migrationsDir=/pb/pb_migrations || true
          docker image prune -f
          REMOTE
