name: Deploy — staging

# Triggered by merges to develop. Builds + pushes :develop images to GHCR,
# then SSHes into the VPS and rolls the staging stack.
on:
  push:
    branches: [develop]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-stage
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_ASTRO: ghcr.io/micio86dev/portfolio-astro
  IMAGE_PB: ghcr.io/micio86dev/portfolio-pb
  TAG: develop
  SITE_URL: https://stage.micio86dev.it

jobs:
  deploy:
    name: build → push → deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push astro image
        uses: docker/build-push-action@v6
        with:
          context: ./astro
          push: true
          tags: ${{ env.IMAGE_ASTRO }}:${{ env.TAG }}
          # PUBLIC_PB_URL is NOT a build arg — it's injected at container start
          # (see docker-compose.stage.yml). Only the public SITE_URL is baked in.
          build-args: |
            SITE_URL=${{ env.SITE_URL }}

      - name: Build & push pocketbase image
        uses: docker/build-push-action@v6
        with:
          context: ./pb
          push: true
          tags: ${{ env.IMAGE_PB }}:${{ env.TAG }}

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Sync compose files to VPS
        env:
          SSH_TARGET: ${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}
        run: |
          scp -o StrictHostKeyChecking=accept-new \
            docker-compose.prod.yml docker-compose.stage.yml \
            "${SSH_TARGET}:/var/www/html/stage.micio86dev.it/"

      - name: Sync nginx stage configs to VPS
        # Two site files: portfolio-stage (the Astro app, stage.micio86dev.it) and
        # portfolio-stage-pb (PocketBase, pb-stage.micio86dev.it). Both are
        # authoritative — they carry their own :443/SSL blocks, so re-copying them
        # on every deploy does not clobber Certbot (which only renews the certs).
        #
        # The deploy user is non-root, so /etc/nginx isn't directly writable: we scp
        # into the user's home, then `sudo install` the files into place. This needs
        # PASSWORDLESS SUDO on the VPS for that user — it already has Docker-group
        # access (≈ root-equivalent), so the simplest is /etc/sudoers.d/portfolio-deploy
        # (chmod 0440):
        #     <deploy-user> ALL=(ALL) NOPASSWD:ALL
        # …or narrow it to: install, ln, /usr/sbin/nginx, /usr/bin/systemctl reload nginx.
        # (If `sudo` complains "sorry, you must have a tty", add `Defaults:<user> !requiretty`.)
        #
        # /etc/nginx/.htpasswd_portfolio_stage must also already exist (basic-auth for
        # the staging app), created once by hand, never committed:
        #   sudo apt install apache2-utils -y
        #   sudo htpasswd -c /etc/nginx/.htpasswd_portfolio_stage YOUR_USERNAME
        env:
          SSH_TARGET: ${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}
        run: |
          scp -o StrictHostKeyChecking=accept-new \
            nginx/stage.conf    "${SSH_TARGET}:.deploy-nginx-stage.conf"
          scp -o StrictHostKeyChecking=accept-new \
            nginx/stage-pb.conf "${SSH_TARGET}:.deploy-nginx-stage-pb.conf"
          ssh -o StrictHostKeyChecking=accept-new "${SSH_TARGET}" 'bash -se' <<'REMOTE'
          set -euo pipefail
          sudo install -m 0644 -o root -g root "$HOME/.deploy-nginx-stage.conf"    /etc/nginx/sites-available/portfolio-stage
          sudo install -m 0644 -o root -g root "$HOME/.deploy-nginx-stage-pb.conf" /etc/nginx/sites-available/portfolio-stage-pb
          rm -f "$HOME/.deploy-nginx-stage.conf" "$HOME/.deploy-nginx-stage-pb.conf"
          sudo ln -sf /etc/nginx/sites-available/portfolio-stage    /etc/nginx/sites-enabled/portfolio-stage
          sudo ln -sf /etc/nginx/sites-available/portfolio-stage-pb /etc/nginx/sites-enabled/portfolio-stage-pb
          sudo nginx -t
          sudo systemctl reload nginx
          REMOTE

      - name: Write runtime env on VPS
        # docker-compose.stage.yml reads ${STAGE_PB_URL} from this .env. The
        # value is piped over the SSH session — never echoed to the build log.
        env:
          SSH_TARGET: ${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}
          STAGE_PB_URL: ${{ secrets.STAGE_PB_URL }}
        run: |
          printf 'STAGE_PB_URL=%s\n' "$STAGE_PB_URL" \
            | ssh -o StrictHostKeyChecking=accept-new "${SSH_TARGET}" \
              'umask 077 && cat > /var/www/html/stage.micio86dev.it/.env'

      - name: Deploy on VPS
        env:
          SSH_TARGET: ${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new "${SSH_TARGET}" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /var/www/html/stage.micio86dev.it
          docker compose -f docker-compose.prod.yml -f docker-compose.stage.yml pull
          docker compose -f docker-compose.prod.yml -f docker-compose.stage.yml up -d --remove-orphans
          docker exec portfolio-stage-pocketbase \
            /pb/pocketbase migrate up --dir=/pb/pb_data --migrationsDir=/pb/pb_migrations || true
          docker image prune -f
          REMOTE
