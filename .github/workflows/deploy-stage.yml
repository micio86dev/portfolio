name: Deploy — staging

# Triggered by merges to develop. First runs the shared test workflow
# (lint + astro check + Vitest ≥85% coverage + Playwright E2E + build); only if
# that passes does it build + push the :develop images to GHCR and SSH into the
# VPS to roll the staging stack.
on:
  push:
    branches: [develop]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-stage
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_ASTRO: ghcr.io/micio86dev/portfolio-astro
  IMAGE_PB: ghcr.io/micio86dev/portfolio-pb
  TAG: develop
  SITE_URL: https://stage.micio86dev.it
  # docker/* and ssh-agent still ship Node 20 builds; force them onto Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  deploy:
    name: build → push → deploy
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push astro image
        uses: docker/build-push-action@v6
        with:
          context: ./astro
          push: true
          tags: ${{ env.IMAGE_ASTRO }}:${{ env.TAG }}
          # PUBLIC_PB_URL is NOT a build arg — it's injected at container start
          # (see docker-compose.stage.yml). Only the public SITE_URL is baked in.
          build-args: |
            SITE_URL=${{ env.SITE_URL }}

      - name: Build & push pocketbase image
        uses: docker/build-push-action@v6
        with:
          context: ./pb
          push: true
          tags: ${{ env.IMAGE_PB }}:${{ env.TAG }}

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Sync compose files to VPS
        env:
          SSH_TARGET: ${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}
        run: |
          scp -o StrictHostKeyChecking=accept-new \
            docker-compose.prod.yml docker-compose.stage.yml \
            "${SSH_TARGET}:/var/www/html/stage.micio86dev.it/"

      # NOTE: nginx is NOT touched by this workflow (same as deploy-prod.yml). The
      # deploy user is non-root and must not be a sudoer. The staging vhosts
      # (nginx/stage.micio86dev.it.conf and nginx/pb-stage.micio86dev.it.conf) are
      # placed in /etc/nginx/sites-available on the VPS ONCE, by hand, as root —
      # see README "Host nginx". They carry their own :443/SSL block, so Certbot
      # only has to renew the certs, never rewrite the configs.

      - name: Write runtime env on VPS
        # docker-compose.stage.yml reads ${STAGE_PB_URL} from this .env. The
        # value is piped over the SSH session — never echoed to the build log.
        env:
          SSH_TARGET: ${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}
          STAGE_PB_URL: ${{ secrets.STAGE_PB_URL }}
        run: |
          printf 'STAGE_PB_URL=%s\n' "$STAGE_PB_URL" \
            | ssh -o StrictHostKeyChecking=accept-new "${SSH_TARGET}" \
              'umask 077 && cat > /var/www/html/stage.micio86dev.it/.env'

      - name: Deploy on VPS
        env:
          SSH_TARGET: ${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new "${SSH_TARGET}" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /var/www/html/stage.micio86dev.it
          docker compose -f docker-compose.prod.yml -f docker-compose.stage.yml pull
          docker compose -f docker-compose.prod.yml -f docker-compose.stage.yml up -d --remove-orphans
          docker exec portfolio-stage-pocketbase \
            /pb/pocketbase migrate up --dir=/pb/pb_data --migrationsDir=/pb/pb_migrations || true
          docker image prune -f
          REMOTE
