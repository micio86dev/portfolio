name: CI

# Fast PR gate: lint + type-check + production build. No Docker build here — that
# runs only on merges to develop/main (deploy-stage / deploy-prod).
on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint + astro check + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: astro
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: astro/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Build
        # PB_URL is left empty so the build uses the bundled seed data (no
        # network dependency in CI). SITE_URL is a harmless placeholder.
        env:
          PB_URL: ""
          SITE_URL: https://micio86dev.it
        run: npm run build
