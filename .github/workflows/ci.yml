name: CI

# PR gate for develop/main: runs the shared test workflow (lint + astro check +
# Vitest with the ≥85% coverage gate + Playwright E2E + production build). On
# pushes to develop/main the deploy workflows run the same `tests.yml` as a
# `needs:` gate, so it isn't duplicated here.
on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/tests.yml
